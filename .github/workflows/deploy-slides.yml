name: Deploy Slides to GitHub Pages

# Every deck lives in a directory named <YYYY-MM-DD>-<event>-presentation and is published at
# https://orange-case.github.io/slides/<directory>/. A new deck needs no change here.

on:
  push:
    branches:
      - main
    paths:
      - '20*/**'
      - 'site/**'
      - '.github/workflows/deploy-slides.yml'
  pull_request:
    paths:
      - '20*/**'
      - 'site/**'
      - '.github/workflows/deploy-slides.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build every deck
        env:
          REPO: ${{ github.event.repository.name }}
          # Building needs no browser; playwright-chromium (PDF export, screenshots) would try to download one.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          set -euo pipefail
          mkdir -p gh-pages
          for dir in 20*/; do
            dir="${dir%/}"
            [ -f "$dir/package.json" ] || continue
            echo "::group::$dir"
            (cd "$dir" && npm ci && npm run build -- --base "/$REPO/$dir/")
            mkdir -p "gh-pages/$dir"
            cp -r "$dir/dist/." "gh-pages/$dir/"
            echo "::endgroup::"
          done

      - name: Write the index page
        run: node site/build-index.mjs gh-pages

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
